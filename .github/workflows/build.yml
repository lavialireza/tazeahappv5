name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Check Gradle
        run: gradle --version

      - name: Clean previous build outputs
        run: gradle :app:clean --no-build-cache

      - name: Build Admin Debug APK
        run: gradle :app:assembleAdminDebug -PreleaseNumber=$((100000 + GITHUB_RUN_NUMBER)) --stacktrace --warning-mode all --no-build-cache

      - name: Clean before Viewer build
        run: gradle :app:clean --no-build-cache

      - name: Verify Viewer source tree is isolated
        shell: bash
        run: |
          set -euo pipefail
          echo "Viewer source assets:"
          find app/src/viewer/assets -type f -print | sort
          echo "Admin source assets:"
          find app/src/admin/assets -type f -print | sort
          if find app/src/viewer/assets -type f -name '*.json' -print -quit | grep -q .; then
            echo 'ERROR: Viewer source tree contains plaintext JSON.'
            exit 1
          fi

      - name: Build Viewer Debug APK
        run: gradle :app:assembleViewerDebug -PreleaseNumber=$((100000 + GITHUB_RUN_NUMBER)) --stacktrace --warning-mode all --no-build-cache

      - name: Verify APK version codes match release number
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$((100000 + GITHUB_RUN_NUMBER))"
          # Find an installed aapt instead of hard-coding one Build Tools version.
          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt -perm -111 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${AAPT}" ] || [ ! -x "${AAPT}" ]; then
            echo "ERROR: Android aapt was not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi

          for APK in app/build/outputs/apk/admin/debug/app-admin-debug.apk app/build/outputs/apk/viewer/debug/app-viewer-debug.apk; do
            test -f "$APK"

            # Extract only the numeric value after versionCode='...'.
            BADGING="$($AAPT dump badging "$APK")"
            CODE="$(printf '%s\n' "$BADGING" | grep -oE "versionCode='[0-9]+'" | head -n 1 | sed "s/versionCode='//;s/'//")"

            if [ -z "$CODE" ]; then
              echo "ERROR: Could not read versionCode from $APK"
              echo "$BADGING"
              exit 1
            fi

            echo "$APK versionCode=$CODE expected=$EXPECTED"
            test "$CODE" = "$EXPECTED"
          done

      - name: Verify Admin and Viewer package identities
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt -perm -111 2>/dev/null | sort -V | tail -n 1)"
          test -n "${AAPT}"
          ADMIN_BADGING="$($AAPT dump badging app/build/outputs/apk/admin/debug/app-admin-debug.apk)"
          VIEWER_BADGING="$($AAPT dump badging app/build/outputs/apk/viewer/debug/app-viewer-debug.apk)"
          echo "$ADMIN_BADGING" | grep -Fq "package: name='com.example.bookapp'"
          echo "$VIEWER_BADGING" | grep -Fq "package: name='com.example.bookapp.viewer'"
          if echo "$VIEWER_BADGING" | grep -Fq "package: name='com.example.bookapp'"; then
            echo 'ERROR: Viewer applicationId matches Admin.'
            exit 1
          fi
          echo 'Admin/Viewer applicationId isolation passed.'

      - name: Verify Viewer APK contains no Admin-only classes
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/viewer/debug/app-viewer-debug.apk
          test -f "$APK"
          LIST="$(mktemp)"
          unzip -Z1 "$APK" > "$LIST"
          # These classes belong exclusively to the Admin flavor and must never
          # be packaged into the public Viewer APK.
          FORBIDDEN=(
            'ContentManagementScreen'
            'ContentEditorScreen'
            'ViewerAccessManagementScreen'
            'SpecialUsersManagementScreen'
            'AccessAuditLogScreen'
            'AccessAuditLog'
            'ContentHealthHelper'
            'ContentTransferHelper'
            'WordContentImport'
            'PolicyAppliedReceiver'
          )
          for NAME in "${FORBIDDEN[@]}"; do
            if grep -Fq "$NAME" "$LIST"; then
              echo "ERROR: Admin-only symbol leaked into Viewer APK: $NAME"
              exit 1
            fi
          done
          echo 'Viewer APK Admin-code isolation passed.'
          rm -f "$LIST"

      - name: Verify APKs and Viewer assets
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/admin/debug/app-admin-debug.apk
          test -f app/build/outputs/apk/viewer/debug/app-viewer-debug.apk
          unzip -l app/build/outputs/apk/viewer/debug/app-viewer-debug.apk | grep -F 'assets/content/001_sample.taz'
          # The public Viewer must contain only protected .taz content. No raw JSON
          # content (including the shared main source-set assets) may leak into it.
          APK_LIST="$(mktemp)"
          unzip -Z1 app/build/outputs/apk/viewer/debug/app-viewer-debug.apk > "$APK_LIST"
          echo 'Viewer content entries:'
          grep '^assets/content/' "$APK_LIST" || true
          JSON_ASSETS="$(grep -Ei '^assets/.*\.json$' "$APK_LIST" || true)"
          if [ -n "$JSON_ASSETS" ]; then
            echo 'ERROR: plaintext JSON content was packaged in Viewer APK:'
            printf '%s\n' "$JSON_ASSETS"
            exit 1
          fi
          if ! grep -Fxq 'assets/content/001_sample.taz' "$APK_LIST"; then
            echo 'ERROR: protected Viewer content asset is missing: assets/content/001_sample.taz'
            exit 1
          fi
          rm -f "$APK_LIST"
          echo 'Viewer APK contains the protected .taz asset and no plaintext JSON assets.'
          echo 'APK verification passed.'

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: tazieh-admin-debug-apk
          path: app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Viewer APK
        uses: actions/upload-artifact@v4
        with:
          name: tazieh-viewer-debug-apk
          path: app/build/outputs/apk/viewer/debug/app-viewer-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            app/build/outputs/apk/admin/debug/app-admin-debug.apk \
            app/build/outputs/apk/viewer/debug/app-viewer-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tazieh Android - Admin and Viewer #${GITHUB_RUN_NUMBER}" \
            --notes "Two debug APKs: Admin and offline Viewer." \
            --prerelease

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
